<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reserve a table at Gion Asakura — Italian restaurant in Gion, Kyoto.">
  <title>Reserve · Gion Asakura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+JP:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="book-page">
  <header class="site-header is-solid">
    <div class="header-inner">
      <a href="en/index.html" class="logo" id="logoLink">Gion Asakura</a>
    </div>
  </header>

  <main class="book-wrap">
    <a class="book-back" id="backLink" href="en/index.html">← <span data-i18n="back">Back</span></a>
    <p class="section-label" data-i18n="eyebrow">Reservation</p>
    <h1 data-i18n="title">Reserve a table</h1>
    <p class="book-lead" data-i18n="intro">Send us your request via WhatsApp — we'll confirm availability and get back to you.</p>

    <div class="book-card">
      <div class="field-row">
        <div class="field">
          <label data-i18n="date">Date</label>
          <input type="date" id="f-date">
        </div>
        <div class="field">
          <label data-i18n="time">Time</label>
          <select id="f-time">
            <option>17:30</option><option>18:00</option><option>18:30</option>
            <option>19:00</option><option>19:30</option><option>20:00</option>
            <option>20:30</option><option>21:00</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label data-i18n="guests">Guests</label>
          <select id="f-guests">
            <option>1</option><option selected>2</option><option>3</option><option>4</option>
            <option>5</option><option>6</option><option>7</option><option>8</option><option>9</option>
          </select>
        </div>
        <div class="field">
          <label data-i18n="name">Name</label>
          <input type="text" id="f-name" autocomplete="name">
        </div>
      </div>
      <div class="field">
        <label data-i18n="notes">Notes (seating, allergies, occasion…)</label>
        <textarea id="f-notes"></textarea>
      </div>

      <div class="book-summary" id="summary"></div>

      <button type="button" class="btn btn--dark" id="submit" style="width:100%">
        <span data-i18n="submit">Send via WhatsApp</span>
      </button>
      <p class="menu-note" data-i18n="foot">Omakase ¥15,000 / guest (tax included; drinks separate). Reservations are required — please book by the day before. Tel +81 75-561-3828.</p>
    </div>
  </main>

  <script>
  (function () {
    var WA = "85290744644";
    var params = new URLSearchParams(location.search);
    var lang = (params.get("lang") || "en").toLowerCase();
    if (["en","jp","cn"].indexOf(lang) === -1) lang = "en";

    var I18N = {
      en: { back:"Back", eyebrow:"Reservation", title:"Reserve a table",
        intro:"Omakase only · ¥15,000 per guest (tax included; drinks separate). Send your request via WhatsApp. Reservations are required — please book by the day before.",
        date:"Date", time:"Time", guests:"Guests",
        name:"Name", notes:"Notes (private booking for 6–9, allergies, occasion…)", submit:"Send via WhatsApp",
        foot:"Omakase ¥15,000 / guest (tax included; drinks separate). Reservations are required — please book by the day before. Tel +81 75-561-3828.",
        sumTitle:"Your request", sDate:"Date", sTime:"Time", sGuests:"Guests", sName:"Name", sNotes:"Notes", none:"—",
        msgHead:"Reservation request — Gion Asakura (Omakase)", htmlLang:"en", logo:"Gion Asakura" },
      jp: { back:"戻る", eyebrow:"ご予約", title:"ご予約",
        intro:"お任せコースのみ · お一人様 ¥15,000（税込・ドリンク別）。WhatsApp でリクエストをお送りください。ご予約は前日までにお願いいたします。",
        date:"ご希望日", time:"ご希望時間", guests:"人数",
        name:"お名前", notes:"ご要望（6〜9名様貸切・アレルギー・記念日など）", submit:"WhatsApp で送信",
        foot:"お任せコース ¥15,000／お一人様（税込・ドリンク別）。完全予約制のため、ご予約は前日までにお願いいたします。Tel 075-561-3828。",
        sumTitle:"ご予約内容", sDate:"ご希望日", sTime:"ご希望時間", sGuests:"人数", sName:"お名前", sNotes:"ご要望", none:"—",
        msgHead:"予約リクエスト — 祇園あさくら（おまかせコース）", htmlLang:"ja", logo:"祇園あさくら" },
      cn: { back:"返回", eyebrow:"预约", title:"预约餐位",
        intro:"仅提供主厨全权安排（Omakase）套餐 · 每位 ¥15,000（含税，饮品另计）。通过 WhatsApp 发送请求。请于前一日前完成预约。",
        date:"日期", time:"时间", guests:"人数",
        name:"姓名", notes:"备注（6〜9 位包场、过敏、纪念日等）", submit:"通过 WhatsApp 发送",
        foot:"Omakase 每位 ¥15,000（含税，饮品另计）。因实行完全预约制，请于前一日前完成预约。电话 +81 75-561-3828。",
        sumTitle:"预约内容", sDate:"日期", sTime:"时间", sGuests:"人数", sName:"姓名", sNotes:"备注", none:"—",
        msgHead:"预约请求 — 祇園あさくら（Omakase）", htmlLang:"zh-CN", logo:"祇園あさくら" }
    };
    var t = I18N[lang];

    document.documentElement.lang = t.htmlLang;
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var k = el.getAttribute("data-i18n");
      if (t[k]) el.textContent = t[k];
    });
    document.getElementById("backLink").setAttribute("href", lang + "/index.html");
    document.getElementById("logoLink").setAttribute("href", lang + "/index.html");
    document.getElementById("logoLink").textContent = t.logo;

    var elDate = document.getElementById("f-date"),
        elTime = document.getElementById("f-time"),
        elGuests = document.getElementById("f-guests"),
        elName = document.getElementById("f-name"),
        elNotes = document.getElementById("f-notes"),
        summary = document.getElementById("summary");

    function renderSummary() {
      var rows = [
        ["sumTitle", "", true],
        ["sDate", elDate.value || t.none],
        ["sTime", elTime.value || t.none],
        ["sGuests", elGuests.value || t.none],
        ["sName", elName.value || t.none],
        ["sNotes", elNotes.value || t.none]
      ];
      var html = "";
      rows.forEach(function (r) {
        if (r[2]) { html += "<strong>" + t[r[0]] + "</strong><br>"; }
        else { html += t[r[0]] + ": " + escapeHtml(r[1]) + "<br>"; }
      });
      summary.innerHTML = html;
    }
    function escapeHtml(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}

    [elDate, elTime, elGuests, elName, elNotes].forEach(function (el) {
      el.addEventListener("input", renderSummary);
      el.addEventListener("change", renderSummary);
    });
    renderSummary();

    document.getElementById("submit").addEventListener("click", function () {
      var lines = [
        t.msgHead,
        t.sDate + ": " + (elDate.value || t.none),
        t.sTime + ": " + (elTime.value || t.none),
        t.sGuests + ": " + (elGuests.value || t.none),
        t.sName + ": " + (elName.value || t.none),
        t.sNotes + ": " + (elNotes.value || t.none)
      ];
      var text = encodeURIComponent(lines.join("\n"));
      window.open("https://api.whatsapp.com/send?phone=" + WA + "&text=" + text, "_blank");
    });
  })();
  </script>
</body>
</html>
